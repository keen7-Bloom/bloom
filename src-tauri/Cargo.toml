[package]
name = "bloom"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Bloom does almost nothing in Rust at runtime — it creates a window, builds a tray
# menu, and polls power state every 15s. Nothing here is hot, so trading every scrap
# of CPU optimisation for binary size is free.
[profile.release]
opt-level = "z"     # size over speed
lto = "fat"         # cross-crate inlining and dead-code elimination
codegen-units = 1   # one unit so LTO sees everything
panic = "abort"     # drops the unwinding tables
strip = true        # no symbols in the shipped binary

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.151"
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-desktop-underlay = "0.2.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

